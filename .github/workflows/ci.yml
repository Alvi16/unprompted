name: tests

on:
  push:
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }}, Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install tools
        run: python -m pip install -r requirements-dev.txt

      - name: Check style
        run: |
          ruff check .
          ruff format --check .

      - name: Run tests (Linux, virtual display)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          xvfb-run --auto-servernum python -m pytest -rs

      - name: Run tests (Windows and macOS)
        if: runner.os != 'Linux'
        run: python -m pytest -rs

      - name: Launch the terminal version and interrupt it
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          status=0
          printf '' | python -m unprompted || status=$?
          test "$status" -eq 130
